<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accenture × SFF — Open Roles</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
  :root {
    --acn-purple: #A100FF;
    --acn-dark: #1a1a1a;
    --acn-mid: #555;
    --acn-border: #e8e8e8;
    --acn-bg: #f7f7f7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--acn-bg); color: var(--acn-dark); }

  /* ── Header ── */
  .page-header {
    background: var(--acn-dark); color: #fff;
    padding: 20px 16px 16px;
  }
  .page-header h1 { font-size: 20px; font-weight: 600; line-height: 1.2; }
  .page-header h1 span { color: var(--acn-purple); }
  .page-header p { margin-top: 4px; font-size: 11px; color: #aaa; }

  /* ── Pillar header ── */
  .pillar-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px;
    font-size: 13px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    color: #fff; margin-top: 16px;
  }
  .pillar-count { font-size: 11px; font-weight: 400; opacity: 0.85; }

  /* ── Role cards ── */
  .cards-wrap { padding: 0 12px; }

  .role-card {
    background: #fff;
    border-radius: 10px;
    margin: 8px 0;
    padding: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .card-info { flex: 1; min-width: 0; }
  .card-role { font-size: 14px; font-weight: 600; color: var(--acn-dark); line-height: 1.3; }
  .card-level {
    display: inline-block; margin-top: 5px;
    background: #f0e6ff; color: var(--acn-purple);
    font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 20px;
  }
  .card-email { margin-top: 5px; font-size: 10px; color: #888; word-break: break-all; }

  .card-qr { flex-shrink: 0; text-align: center; }
  .card-qr canvas, .card-qr img { width: 80px !important; height: 80px !important; display: block; }
  .card-qr-label { font-size: 9px; color: #999; margin-top: 3px; text-align: center; }

  /* ── Footer ── */
  .page-footer {
    margin-top: 24px;
    border-top: 1px solid var(--acn-border);
    padding: 12px 16px;
    font-size: 10px; color: #bbb; text-align: center;
  }

  @media (min-width: 600px) {
    .page-header { padding: 24px 32px 20px; }
    .page-header h1 { font-size: 24px; }
    .cards-wrap { padding: 0 20px; }
    .role-card { padding: 16px 20px; }
    .card-role { font-size: 15px; }
    .card-qr canvas, .card-qr img { width: 90px !important; height: 90px !important; }
  }
</style>
</head>
<body>

  <h1>Accenture <span>×</span> SFF<br>Open Roles</h1>
  <p>SFF '26 · 9 Oct 2026 · Scan to view JD &amp; apply</p>
</header>

<div id="mainContent"></div>

<footer class="page-footer">
  Accenture Singapore · For event use only · 9 Oct 2026
</footer>

<script>

      { role: "AgentOps Engineer", level: "ML9 – ML8", email: "arriane.c.de.guzman@accenture.com", adUrl: "https://accenture.wd103.myworkdayjobs.com/AccentureCareers/job/Singapore/AgentOps-Engineer---AI-Managed-Services_R00344460" },

  {

const regUrl = "https://accenture.wd103.myworkdayjobs.com/AccentureCareers/event/01b9dc277c7110015c61ebb0359b0000/register";
const container = document.getElementById('mainContent');
let qrIndex = 0;

// Registration + CV Upload section — shown first
const regHeader = document.createElement('div');
regHeader.className = 'pillar-header';
regHeader.style.background = '#A100FF';
regHeader.style.marginTop = '8px';
regHeader.innerHTML = `<span>Registration &amp; CV Upload</span>`;
container.appendChild(regHeader);

const regWrap = document.createElement('div');
regWrap.className = 'cards-wrap';

const regId = `qr-reg`;
const regCard = document.createElement('div');
regCard.className = 'role-card';
regCard.style.justifyContent = 'center';
regCard.style.flexDirection = 'column';
regCard.style.alignItems = 'center';
regCard.style.gap = '12px';
regCard.style.padding = '24px 16px';
regCard.innerHTML = `
  <div style="text-align:center; width:100%;">
    <div class="card-role" style="font-size:15px; text-align:center;">Register for the Event &amp; Upload Your CV</div>
    <div class="card-email" style="margin-top:8px;font-size:11px;color:#666; text-align:center;">Scan the QR code below to register and deposit your CV with Accenture</div>

      <div>
        <div id="${regId}"></div>
        <div class="card-qr-label" style="font-size:10px;margin-top:6px;text-align:center;">Scan to register &amp; upload CV</div>
      </div>
    </div>
  </div>
`;
regWrap.appendChild(regCard);
container.appendChild(regWrap);

requestAnimationFrame(() => {
  new QRCode(document.getElementById(regId), {
    text: regUrl, width: 140, height: 140,
    colorDark: "#A100FF", colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.M
  });
});

pillars.forEach(pillar => {
  // Pillar header
  const ph = document.createElement('div');
  ph.className = 'pillar-header';
  ph.style.background = pillar.color;
  ph.innerHTML = `<span>${pillar.name}</span><span class="pillar-count">${pillar.roles.length} role${pillar.roles.length > 1 ? 's' : ''}</span>`;
  container.appendChild(ph);

  const wrap = document.createElement('div');
  wrap.className = 'cards-wrap';

  pillar.roles.forEach(r => {
    const adId = `qr-ad-${qrIndex++}`;
    const card = document.createElement('div');
    card.className = 'role-card';
    card.innerHTML = `
      <div class="card-info">
        <div class="card-role">${r.role}</div>
        <span class="card-level">${r.level}</span>
        <div class="card-email">${r.email}</div>
      </div>
      <div class="card-qr">
        <div id="${adId}"></div>
        <div class="card-qr-label">Scan to apply</div>
      </div>
    `;
    wrap.appendChild(card);

    requestAnimationFrame(() => {
      new QRCode(document.getElementById(adId), {
        text: r.adUrl, width: 80, height: 80,
        colorDark: "#A100FF", colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    });
  });

  container.appendChild(wrap);
});


</script>
</body>
</html>
