  .qr-wrapper { display: inline-flex; flex-direction: column; align-items: center; gap: 3px; }
  .qr-wrapper canvas, .qr-wrapper img { width: 60px !important; height: 60px !important; display: block; }
  .qr-label { font-size: 9px; color: #999; text-align: center; max-width: 100px; line-height: 1.3; }

    table { page-break-inside: auto; }
    thead { display: table-header-group; }
